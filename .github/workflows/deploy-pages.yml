# 将 voltageshop 静态网站自动部署到 GitHub Pages
name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'voltageshop/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# 允许 GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件（voltageshop 作为站点根目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: voltageshop

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
